<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Automated tests for the task-board custom element">
    <title>task-board Test Runner</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        html {
            color-scheme: light dark;
        }

        body {
            display: grid;
            overflow: hidden;
        }

        svg {
            display: none;
        }
    </style>
    <noscript>
        <style>
            test-runner {
                display: none;
            }
        </style>
    </noscript>
    <link rel="stylesheet" href="public/tests.theme.css">
    <link rel="stylesheet" href="public/tests.css">
</head>

<body>
    <header class="page-header">
        <div class="arrows">
            <span class="arrow">
                <svg class="icon arrow-icon">
                    <use href="#icon-definition_arrow"></use>
                </svg>
            </span>
            <span class="arrow reverse">
                <svg class="icon arrow-icon">
                    <use href="#icon-definition_arrow"></use>
                </svg>
            </span>
            <span class="arrow">
                <svg class="icon arrow-icon">
                    <use href="#icon-definition_arrow"></use>
                </svg>
            </span>
        </div>
        <div class="text">
            <div class="breadcrumbs">
                <a class="breadcrumb" href="https://github.com/catapart">@catapart</a>
                <a class="breadcrumb" href="index.html">task-board</a>
            </div>
            <h1 class="title">Automated Testing</h1>
        </div>
    </header>
    <main>
        <test-runner>
            <div class="message">Automated testing has not been prepared for this library.</div>
            <task-board>
                <h4 slot="header">Around the House</h4> <task-list name="Housework" color="#4213ce"> <task-list name="Kitchen" color="#7e51f5" drag-drop> <task-card value="Dishes"></task-card> <task-card value="Counters"></task-card> <task-card value="Floor"></task-card> </task-list> <task-list name="Laundry" color="#bea6fd" drag-drop> <task-card value="Wash and Dry"></task-card> <task-card value="Ironing"></task-card> <task-card value="Change Linens"></task-card> </task-list> <task-list name="Yard" color="#dbcdfe" drag-drop> <task-card value="Mow"></task-card> <task-card value="Edge"></task-card> <task-card value="Rake"></task-card> </task-list> </task-list> <task-list name="Shopping" color="#1d6e72"> <task-list name="Grocery" color="#a4f6fe"> <task-list name="Produce" color="#08ccd8" drag-drop> <task-card value="Tomato"></task-card> <task-card value="Cucumber"></task-card> <task-card value="Red Onion"></task-card> </task-list> <task-list name="Dairy" color="#4ceefb" drag-drop> <task-card value="Milk"></task-card> <task-card value="Butter"></task-card> </task-list> <task-list name="Snacks" color="#ccfaff" drag-drop> <task-card value="Corn chips"></task-card> <task-card value="Popcorn"></task-card> <task-card value="Ice cream sandwiches"></task-card> </task-list> </task-list> <task-list name="Cleaning" color="#a4f6fe" drag-drop> <task-card value="Trash bags"></task-card> </task-list> <task-list name="Garden" color="#a4f6fe" drag-drop> <task-card value="Soil"></task-card> <task-card value="Trimmer string"></task-card> </task-list> <task-list name="Pharmacy" color="#a4f6fe" drag-drop> <task-card value="My prescription"></task-card> <task-card value="Generic painkiller"></task-card> </task-list> </task-list> <task-list name="Car" color="#63382c"> <task-list name="Maintenance" color="#b54c2b" drag-drop> <task-card value="Oil change"></task-card> <task-card value="New wiper blades"></task-card> </task-list> <task-list name="Service" color="#e8825e" drag-drop> <task-card value="Hood dent"></task-card> <task-card value="New tires"></task-card> </task-list> </task-list> <task-list name="Practice" color="#5fa43c" drag-drop> <task-card value="Warmup"></task-card> <task-card value="Set list"></task-card> <task-card value="New songs"></task-card> </task-list>
                <footer slot="footer">
                    <div class="info">Today: <span class="value"></span></div>
                    <div class="tip"><small><em>Tip: Use <key>Shift</key> + <key>Mouse Scroll Wheel</key> to scroll horizontally.</em></small></div>
                </footer>
            </task-board>
        </test-runner>
        <noscript>
            <div class="noscript message warn">
                <p>This page is a dynamic test runner for a javascript library. Javascript libraries require javascript to function and cannot process at all if javascript is disbled or otherwise prevented from running.</p>
                <p>To test the library, this page also uses custom elements designed for testing javascript code. To see the testing results and confirm the library's functionality, please enable javascript.</p>
            </div>
        </noscript>
    </main>
    <div id="icon-definitions">
        <svg id="icon-definition_arrow" viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
            <path d="m3.26,6.81l-2.93,-4.69c-0.37,-0.58 0.05,-1.34 0.74,-1.34l5.87,0c0.69,0 1.11,0.76 0.74,1.34l-2.93,4.69c-0.35,0.55 -1.14,0.55 -1.49,0z" fill="var(--fill-color)" />
        </svg>
    </div>
    <script type="module" src="public/libs/test-runner.min.js"></script>

    <script type="module" src="public/libs/task-board.min.js"></script>
</body>

</html>
